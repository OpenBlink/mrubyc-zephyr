sample:
  name: mruby/c task scheduling
tests:
  sample.mrubyc.vm_tasks:
    tags: mrubyc
    platform_allow: [native_sim, qemu_cortex_m3]
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - 'a:start'
        - 'b:ran'
        - 'a:done'
        - 'Scheduler returned 0'
