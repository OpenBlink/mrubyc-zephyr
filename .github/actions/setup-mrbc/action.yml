name: Set up mrbc
description: Build or restore the host compiler for the bundled mruby/c release
outputs:
  path:
    description: Absolute path to the verified mrbc executable
    value: ${{ steps.verify.outputs.path }}
runs:
  using: composite
  steps:
    - name: Identify the host toolchain
      id: toolchain
      shell: bash
      run: |
        fingerprint=$( { cc --version; ruby --version; rake --version; bison --version; } | sha256sum | cut -d' ' -f1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - name: Cache mrbc
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mrubyc-mrbc
        key: mrbc-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('**/scripts/build-mrbc.sh') }}
    - name: Build mrbc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MODULE: ${{ github.action_path }}/../../..
      run: bash "$MODULE/scripts/build-mrbc.sh" "$RUNNER_TEMP/mrubyc-mrbc"
    - name: Verify bytecode generation
      id: verify
      shell: bash
      env:
        MODULE: ${{ github.action_path }}/../../..
      run: |
        compiler="$RUNNER_TEMP/mrubyc-mrbc/bin/mrbc"
        "$compiler" --version
        bash "$MODULE/scripts/check-bytecode.sh" "$compiler"
        echo "path=$compiler" >> "$GITHUB_OUTPUT"
