name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and approval policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and production policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh
      - name: Test release policy
        run: bash .github/scripts/test_release_policy.sh
      - name: Verify the tag matches the runtime
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(sed -nE 's/^MRUBYC_VERSION[[:blank:]]*=[[:blank:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' vendor/mrubyc/src/VERSION)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$tag" != "v$version" ]]; then
            echo "::error::The release tag must match the bundled MRUBYC_VERSION (v$version)"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12 supports relative workflow paths

  publish:
    needs: [validate, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck production policy and require a new Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh --publish-check
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
